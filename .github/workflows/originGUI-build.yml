name: Autobuild originGUI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'originGUI/src/**'
      - 'originGUI/build.mjs'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        version: latest
        runtime: node@20
        install: false

    - name: Install dependencies
      run: cd originGUI && pnpm install

    - name: Build originGUI
      run: cd originGUI && pnpm build

    - name: Commit built bundle
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add originGUI/dist/bundle.js
        git commit -s -m "AutoBuild originGUI" || echo "No changes"

    - name: Push changes to GitHub
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
